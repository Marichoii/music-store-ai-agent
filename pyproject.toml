[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "music-store-ai-agent"
version = "0.1.0"
description = "Customer-service assistant for Empório da Música."
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "google-genai>=1.50,<3",
  "httpx>=0.28,<1",
  "langdetect>=1.0.9,<2",
  "pydantic>=2.10,<3",
  "pypdf>=6,<7",
  "python-dotenv>=1.1,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx2>=2,<3", "pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/music_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
